[project]
name = "weightCounter"
version = "1.4.0"  # 运行时版本唯一来源：app/version.py
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyqtgraph==0.13.7",
    "pyside6==6.8.3",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pillow>=12.2.0",
    "pyinstaller>=6.19.0",
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "types-toml>=0.10.8.20260408",
]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = "pyqtgraph"
ignore_missing_imports = true
