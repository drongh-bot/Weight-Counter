[project]
name = "weightCounter"
version = "1.5.0"  # 运行时版本唯一来源：app/version.py
description = "工业计件桌面应用：串口电子秤实时稳重判定、自动计件与生产日志"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyqtgraph==0.13.7",
    "pyside6==6.8.3",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pyinstaller>=6.19.0",
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "types-toml>=0.10.8.20260408",
]

[tool.ruff]
# Qt Designer 生成的代码不归手写规范管（重新生成会覆盖）
exclude = ["app/views/ui_generated"]

[tool.ruff.lint]
# BLE001  捕获盲异常 —— 这里是应用层兜底（串口/CSV/播放失败不能崩掉 GUI），故意的
# DTZ011/DTZ005  本地时间 —— 日志按本地日切文件、时间戳给现场看，改 UTC 会错 8 小时
# SIM115  文件句柄 —— CsvWriter 要跨多次 write 长期持有，不能用 with
# N802   camelCase 方法名 —— closeEvent/tickStrings/showEvent 是 Qt 与 pyqtgraph 的虚方法，签名必须跟框架
# N806   函数内的 FakeDate 是**类**（PascalCase 正确），ruff 分不清局部类与变量
# ARG001/ARG002  pytest fixture —— qapp 声明即用（保证 QApplication 存在），不直接引用
ignore = [
    "BLE001",
    "DTZ011",
    "DTZ005",
    "SIM115",
    "N802",
    "N806",
    "ARG001",
    "ARG002",
]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = "pyqtgraph"
ignore_missing_imports = true

# winsound 是 Windows 独有标准库；非 Windows 上跑 mypy 时找不到它
[[tool.mypy.overrides]]
module = "winsound"
ignore_missing_imports = true
